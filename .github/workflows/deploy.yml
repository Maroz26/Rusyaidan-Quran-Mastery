
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.AIzaSyDne6kEXWOogaJX_92qEP-NqEKQDVyEgrI }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.rusyaidan-qur-an-mastery.firebaseapp.com }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.rusyaidan-qur-an-mastery }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.rusyaidan-qur-an-mastery.firebasestorage.app }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.272810170906 }}
          VITE_FIREBASE_APP_ID: ${{ vars.1:272810170906:web:0fd582f0e99f80f7194fa3 }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
